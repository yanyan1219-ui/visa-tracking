<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🇮🇹 意大利签证材料进度</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro",sans-serif;background:#f5f5f7;padding:12px 8px 20px}
h1{text-align:center;font-size:1.2em;color:#1d1d1f;padding:8px 0 2px}
.subtitle{text-align:center;font-size:0.72em;color:#888;margin-bottom:12px}
.section{margin:14px 0 6px;padding:8px;background:#fff;border-radius:10px;border:1px solid #e5e5e5}
.section-title{font-size:0.85em;font-weight:700;color:#c8102e;padding-bottom:6px;border-bottom:1px solid #eee;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:0.8em}
thead th{text-align:center;padding:4px 2px;font-size:0.78em;color:#333;border-bottom:1px solid #ddd}
thead th:first-child{text-align:left;width:50%}
tbody tr{border-bottom:1px solid #f0f0f0}
tbody td{padding:8px 2px;vertical-align:middle;text-align:center}
tbody td:first-child{text-align:left}
td input[type=checkbox]{width:20px;height:20px;accent-color:#006341}
.owner-tag{font-size:0.68em;background:#006341;color:#fff;padding:1px 4px;border-radius:3px;margin-left:4px;white-space:nowrap}
.progress-section{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.person-progress{flex:1;min-width:100px;background:#fff;border-radius:8px;padding:8px;text-align:center;border:1px solid #e5e5e5}
.person-progress .name{font-size:0.82em;font-weight:600;color:#333}
.person-progress .pct{font-size:1.1em;font-weight:700;color:#006341;margin:2px 0}
.pbar{height:5px;background:#e0e0e0;border-radius:3px;margin-top:4px;overflow:hidden}
.pbar-fill{height:100%;background:#006341;border-radius:3px;transition:width .3s}
.actions{text-align:center;margin:14px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.actions button{padding:8px 14px;border:none;border-radius:6px;font-size:0.8em;font-weight:600;cursor:pointer}
.btn-save{background:#006341;color:#fff}
.btn-reset{background:#c8102e;color:#fff}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:10px;font-size:0.9em;display:none;z-index:100}
.footer{text-align:center;font-size:0.7em;color:#aaa;margin-top:16px}
</style>
</head>
<body>
<h1>🇮🇹 意大利签证材料进度</h1>
<div class="subtitle">Yan Yan · Linhui Gong · Yeqing Tan</div>

<div class="progress-section">
<div class="person-progress"><div class="name">Yan Yan</div><div class="pct" id="pct-yanyan">0%</div><div class="pbar"><div class="pbar-fill" id="bar-yanyan"></div></div></div>
<div class="person-progress"><div class="name">Linhui</div><div class="pct" id="pct-linhui">0%</div><div class="pbar"><div class="pbar-fill" id="bar-linhui"></div></div></div>
<div class="person-progress"><div class="name">Yeqing</div><div class="pct" id="pct-yeqing">0%</div><div class="pbar"><div class="pbar-fill" id="bar-yeqing"></div></div></div>
</div>

<div id="content"></div>

<div class="actions">
<button class="btn-save" onclick="save()">💾 保存</button>
<button class="btn-reset" onclick="resetAll()">🔄 全部重置</button>
</div>
<div class="footer">勾选后自动保存到本地 · 最后更新: <span id="last-save">-</span></div>
<div class="toast" id="toast"></div>

<script>
const PEOPLE=[{key:'yanyan',name:'Yan Yan'},{key:'linhui',name:'Linhui'},{key:'yeqing',name:'Yeqing'}];
const ITEMS=[
{section:"申请表及证件照",items:[
{id:"form",label:"签证申请表（填写+打印+签字）"},
{id:"photo",label:"照片2张（3.5×4.5cm白底，近6月）"}
]},
{section:"护照",items:[
{id:"passport",label:"护照原件（有效期>离境后3个月）"},
{id:"passport_copy",label:"护照信息页复印件"},
{id:"old_passport",label:"旧护照原件+复印件"}
]},
{section:"行程相关",items:[
{id:"itinerary",label:"逐日行程计划表",owner:"Yan Yan"},
{id:"flight",label:"往返机票预订单"},
{id:"hotel",label:"全程酒店预订确认单",owner:"Yan Yan"}
]},
{section:"经济证明",items:[
{id:"bank",label:"银行流水（近3-6个月）"},
{id:"employment",label:"在职证明（抬头纸+盖章）"},
{id:"biz_license",label:"公司营业执照复印件（盖章）"}
]},
{section:"保险",items:[
{id:"insurance",label:"申根旅行保险（≥3万欧）"}
]},
{section:"身份材料",items:[
{id:"hukou",label:"户口本整本复印件"},
{id:"id_card",label:"身份证正反面复印件"},
{id:"marriage",label:"结婚证复印件（如适用）"}
]},
{section:"跨领区补充",items:[
{id:"residence",label:"居住证/社保证明（非户口地递签）"}
]}
];

function render(){
  let html='';
  ITEMS.forEach(sec=>{
    html+=`<div class="section"><div class="section-title">${sec.section}</div><table><thead><tr><th>材料</th>`;
    PEOPLE.forEach(p=>{html+=`<th>${p.name}</th>`;});
    html+=`</tr></thead><tbody>`;
    sec.items.forEach(item=>{
      const ownerHtml=item.owner?`<span class="owner-tag">${item.owner}</span>`:'';
      html+=`<tr><td>${item.label}${ownerHtml}</td>`;
      PEOPLE.forEach(p=>{
        const checked=data[p.key]&&data[p.key][item.id];
        html+=`<td><input type="checkbox" ${checked?'checked':''} onchange="toggle('${p.key}','${item.id}',this)"></td>`;
      });
      html+=`</tr>`;
    });
    html+=`</tbody></table></div>`;
  });
  document.getElementById('content').innerHTML=html;
  updateProgress();
}

function updateProgress(){
  const total=ITEMS.reduce((s,sec)=>s+sec.items.length,0);
  PEOPLE.forEach(p=>{
    const done=Object.values(data[p.key]||{}).filter(Boolean).length;
    const pct=Math.round(done/total*100);
    document.getElementById('pct-'+p.key).textContent=`${done}/${total}`;
    document.getElementById('bar-'+p.key).style.width=pct+'%';
  });
}

let data={yanyan:{},linhui:{},yeqing:{}};

function load(){
  const saved=localStorage.getItem('italy-visa-tracker');
  if(saved) data=JSON.parse(saved);
  const ts=localStorage.getItem('italy-visa-tracker-ts');
  if(ts) document.getElementById('last-save').textContent=ts;
  render();
}

function save(){
  const ts=new Date().toLocaleString('zh-CN');
  localStorage.setItem('italy-visa-tracker',JSON.stringify(data));
  localStorage.setItem('italy-visa-tracker-ts',ts);
  document.getElementById('last-save').textContent=ts;
  showToast('✅ 已保存');
}

function toggle(person,itemId,el){
  if(!data[person])data[person]={};
  data[person][itemId]=el.checked;
  save();
  updateProgress();
}

function resetAll(){
  if(confirm('确定重置所有人的进度？')){
    data={yanyan:{},linhui:{},yeqing:{}};
    save();render();
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',1500);
}

load();
</script>
</body>
</html>
